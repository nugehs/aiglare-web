<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="aiglare">
  <defs>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="37" height="37" rx="10" fill="#0d1117"/>
  <!-- the glare: a beam of light shining down onto the audit surface -->
  <path d="M20 7 L29 27 L11 27 Z" fill="url(#beam)"/>
  <!-- the surface line it inspects -->
  <rect x="9" y="28.5" width="22" height="1.6" rx="0.8" fill="#3a424d"/>
  <!-- severity readout caught in the glare: red / amber / green -->
  <circle cx="15.5" cy="32.8" r="1.7" fill="#e5484d"/>
  <circle cx="20" cy="32.8" r="1.7" fill="#f5a623"/>
  <circle cx="24.5" cy="32.8" r="1.7" fill="#30a46c"/>
  <!-- the source point -->
  <circle cx="20" cy="9" r="1.9" fill="#ffd166"/>
</svg>
